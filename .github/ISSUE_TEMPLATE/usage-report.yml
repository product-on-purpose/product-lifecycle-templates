name: Usage report
description: You filled one of these templates for real work
title: "usage: <bundle>"
labels: [usage]
body:
  - type: markdown
    attributes:
      value: |
        **This is the most valuable issue anyone can open here, and the rarest.**

        No template in this library has been filled by anyone but the author. The catalog's own rule gates Tier 2
        on "survives one real usage cycle", so by the library's own standard nothing has graduated. One honest
        usage report changes that.

  - type: input
    id: catalog_ref
    attributes:
      label: Which bundle, and which variant
      description: The bundle id, and whether you used `lean` or `full`.
      placeholder: e.g. prd, full
    validations:
      required: true

  - type: textarea
    id: document_written_today
    attributes:
      label: What you were actually doing
      description: Enough context to judge whether the template fitted the job.
    validations:
      required: true

  - type: textarea
    id: what_worked
    attributes:
      label: What worked
    validations:
      required: false

  - type: textarea
    id: what_did_not
    attributes:
      label: What did not
      description: >-
        A section you skipped and why. A question the ASK block did not ask. A place the guidance
        was wrong for your situation. Blunt is better than polite here.
    validations:
      required: true

  - type: textarea
    id: rubric_match
    attributes:
      label: Did you self-grade against the rubric, and did the score match your own judgement?
      description: >-
        If the rubric said the document was fine and you thought it was not, that is a finding about
        the rubric.
    validations:
      required: false

  - type: input
    id: requester_context
    attributes:
      label: Who you are, and the context you work in
      description: Attribution. A usage report that cannot be attributed is an anecdote.
      placeholder: e.g. "Staff PM, B2B SaaS, 200 people"
    validations:
      required: false

  - type: dropdown
    id: methodology_in_use
    attributes:
      label: The methodology actually in use where you work
      options:
        - Scrum
        - Kanban
        - SAFe
        - XP
        - Shape Up
        - No named methodology
        - Other
    validations:
      required: false
