# Dependency updates.
#
# Adopted from pm-skills per ADR 0051, which chose the family pattern over inventing a local one:
# "match family-wide" is the site plan's own conformance standard, so adopting it IS conformance.
#
# Two ecosystems, deliberately. This repository had NO dependabot.yml at all before the site - not
# even for the GitHub Actions it already ran - so the Actions block below is new coverage rather
# than a carry-over, and it is the reason the file exists at the root rather than only for /site.
#
# Grouped, minor and patch only. Majors arrive as individual pull requests and are read by hand,
# which is where an Astro or Starlight major belongs.
#
# NO `npm audit` gate is added to CI, and no advisory blocks a build. ADR 0051 refused that on
# actionability rather than on safety: a static-site dependency tree is mostly build-time, and an
# advisory a maintainer can only wait out should not block a docs deploy.
#
# The named cost, so it is not a surprise: a recurring weekly pull-request stream in a repository
# that has never had one, and a second dependency surface nobody is obliged to merge.
version: 2
updates:
  # GitHub Actions. Already in use by ci.yml before the site existed, and never covered until now.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm, the Astro Starlight site. The only npm project in this repository: there is deliberately
  # no root package.json, because the donor only has one to hold a js-yaml devDependency and every
  # validator here is Python. See docs/internal/site-s0-spec.md section 5.1.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # The pinned Astro set moves in lockstep with the family, never on its own.
    #
    # Clause 14.8 requires one shared resolved set across the family and names the failure
    # mode outright: "a per-repo npm update that chases latest actively breaks convergence,
    # so toolchain bumps land in lockstep across the family."
    #
    # The group rule above is not enough on its own, and PR #159 proved it within an hour of
    # this file landing. It limits the group to minor and patch, which is ADR 0051's intent:
    # majors arrive individually and get read by hand. But EVERY package in the pinned set
    # except sharp is 0.x, and semver permits breaking changes in a 0.x minor - so
    # 0.41 -> 0.42 is classified "minor" and sails straight through a rule designed to hold
    # breaking changes back.
    #
    # These four are therefore ignored entirely. Bumping them is a deliberate act coordinated
    # with pm-skills, not something Dependabot proposes on a Monday. Everything else in
    # site/package.json still flows through the group above.
    ignore:
      - dependency-name: "astro"
      - dependency-name: "@astrojs/*"
      - dependency-name: "astro-mermaid"
      - dependency-name: "sharp"
