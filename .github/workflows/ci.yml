name: bundle-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The gate's two dependencies: PyYAML (check G, frontmatter validity) and jsonschema
      # (check J, meta-schema validation). The other eight checks are pure stdlib. Installing
      # both here is what makes G and J enforced in CI; locally each SKIPs if its dependency is
      # absent. See decisions 0014 (PyYAML) and 0017 (jsonschema).
      - name: Install gate dependencies
        run: pip install pyyaml jsonschema

      # The bundle gate: eleven structural checks across every bundle.
      - name: Bundle gate
        run: python tools/check-bundles.py

      # Check K's classification-axis branch has no live subject until governance-docs lands,
      # so running the gate cannot exercise it. This fixture-based test proves it accepts a
      # conforming standing member and, more importantly, that it FAILS on a wrong value, a
      # wrong axis in either direction, and a misconfigured registry entry. Covers check K
      # only; the rest of the gate is exercised by the real bundles above.
      - name: Check K self-test
        run: python tools/test-check-k.py

      # The format axis (ADR 0028). Same argument as the check K self-test: most of this logic
      # has no live subject, since one bundle ships a second format and none ships two. The
      # load-bearing assertions are that two formats with unrelated outlines PASS (nesting is
      # within a format, never across), that a `_template-*.md` file the meta never declared
      # FAILS and is also scanned rather than sitting unread, and that a size word inside a
      # guidance sentence does not invent a variant.
      - name: Format axis self-test
        run: python tools/test-check-formats.py

      # The link gate. Bundle-scoped checks cannot see repo-wide breakage: the scaffold
      # graduation (decision 0009) broke four companion links and the bundle gate passed
      # green. This step also enforces the central rule of decision 0013 - no tracked file
      # may link into the untracked _local/, because such a link resolves for exactly one
      # person and 404s for every other reader.
      - name: Link gate
        run: python tools/check-links.py

      # The machine catalog. manifest.json is generated from the metas and committed; this
      # step regenerates it in memory and fails if the committed copy has drifted, and if the
      # README bundle-count marker disagrees with reality (decision 0018, roadmap WP-22).
      - name: Manifest freshness
        run: python tools/gen-manifest.py --check

      # The atlas built flags. atlas/catalog-data.json and the inline copy in atlas/atlas.html
      # both carry a per-type `built` boolean, which drifted (advertised 4 built while 12 existed).
      # This regenerates both from the bundles on disk and fails on drift (same discipline as the
      # manifest; ADR 0018). Closes the atlas half of the same failure class PR #30 corrected.
      - name: Atlas freshness
        run: python tools/gen-atlas.py --check

      # The decision-record index. docs/internal/decisions/README.md is a hand-maintained table;
      # 0022 and 0023 both landed without an index row and sat missing. This fails if any NNNN-*.md
      # ADR file has no index row, or an index row points at no file.
      - name: ADR index
        run: python tools/check-adr-index.py

      # Changelog freshness (DF-3). The three generated artifacts above are gated for drift and stayed
      # fresh; the changelog was not gated and went 28 commits, nine bundles and fourteen decision records
      # without an entry. This fails if any post-0.1.0 decision record is absent from CHANGELOG.md. It is
      # deliberately shallow: it proves nothing is missing, not that what is there is any good, and it says
      # so in its own output.
      - name: Changelog freshness
        run: python tools/check-changelog.py

      # The research-log contract (ADR 0029). The honest-retrieval standard is this library's
      # central quality claim and nothing checked it across sixteen bundles: the requirement bound
      # the research workflow's JSON schema, not the markdown that schema produces. This gates the
      # contract (number, identity, url or a stated exemption, tier, enum retrieval status,
      # Supports) and accepts all three numbered layouts. Six table-layout logs are exempt BY NAME
      # with a measured reason, and the check prints the exemption on every run.
      - name: Research-log contract
        run: python tools/check-research-logs.py

      # Same argument as the other two self-tests: most of the contract check's failure branches
      # have no live subject once the tree is clean, so the only way to know it fails when it should
      # is a fixture. Mutation-checked against three deliberate breakages.
      - name: Research-log contract self-test
        run: python tools/test-check-research-logs.py

      # The gate's dash check (check B) only scans inside bundles, but the house
      # rule is repo-wide and the methodology advertises it as CI-enforced. Without
      # this step an em-dash in the README, in STATE.md, or in any decision record
      # passes green. Scans git-tracked files only: untracked local scratch is not
      # the repo's problem.
      - name: No em-dashes or en-dashes (repo-wide)
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys

          EM, EN = chr(8212), chr(8211)
          EXTS = {".md", ".yaml", ".yml", ".py", ".json"}

          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split("\n")

          bad = []
          for name in tracked:
              if not name or pathlib.Path(name).suffix.lower() not in EXTS:
                  continue
              try:
                  text = pathlib.Path(name).read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              hits = [
                  n for n, line in enumerate(text.splitlines(), 1)
                  if EM in line or EN in line
              ]
              if hits:
                  bad.append((name, hits))

          for name, lines in bad:
              shown = ", ".join(str(n) for n in lines[:10])
              more = " ..." if len(lines) > 10 else ""
              print(f"{name}: em/en-dash on line(s) {shown}{more}")

          if bad:
              print(f"\nFAIL: {len(bad)} tracked file(s) contain an em-dash or en-dash.")
              print("House rule: use ' - ' (space hyphen space), or restructure the")
              print("sentence with a comma, colon, or break. Ranges use plain hyphens.")
              sys.exit(1)

          print("OK: no em-dash or en-dash in any tracked text file.")
          PY
