name: bundle-gate
on:
  # `push` covers every branch, not only `main`. Measured 2026-08-06: PR #73 opened at 22:38 and its
  # `pull_request` run did not dispatch until 23:01, so for twenty-three minutes the required `gate`
  # check did not exist on the head commit and the PR could not merge on its own authority. It was
  # merged with `--admin` instead, overriding the runbook's own no-admin-merge rule, and the decision
  # was taken inside that blind window. Pushes dispatched normally throughout, including the push to
  # `main` seconds after that merge, so a push trigger puts a green required check on a feature branch
  # in about thirty seconds rather than whenever the `pull_request` event happens to arrive.
  #
  # The cost is a duplicate run per push to a PR branch. Actions minutes are free on a public
  # repository and the gate runs in well under a minute, so the duplicate is cheaper than one blocked
  # merge. Deliberately NOT solved with a `concurrency` group: the push and pull_request runs share a
  # ref, so cancel-in-progress would let them cancel each other and could leave the required check in
  # a cancelled state, which is the failure this trigger exists to prevent.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Bumped 2026-08-07: v4/v5 target Node 20, which GitHub deprecated and is force-running on Node 24.
      # A forced runtime is a warning today and a failure whenever the forcing stops.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Node is here for one step only: the Advanced Skill Library Standard's conformance gate at
      # the bottom of this file, which is a Node program in a different repository. Every check in
      # between is Python, and none of them gained a dependency.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The gate's two dependencies: PyYAML (check G, frontmatter validity) and jsonschema
      # (check J, meta-schema validation). The other eight checks are pure stdlib. Installing
      # both here is what makes G and J enforced in CI; locally each SKIPs if its dependency is
      # absent. See decisions 0014 (PyYAML) and 0017 (jsonschema).
      - name: Install gate dependencies
        run: pip install pyyaml jsonschema

      # The bundle gate: eleven structural checks across every bundle.
      - name: Bundle gate
        run: python tools/check-bundles.py

      # Check K's classification-axis branch has no live subject until governance-docs lands,
      # so running the gate cannot exercise it. This fixture-based test proves it accepts a
      # conforming standing member and, more importantly, that it FAILS on a wrong value, a
      # wrong axis in either direction, and a misconfigured registry entry. Covers check K
      # only; the rest of the gate is exercised by the real bundles above.
      - name: Check K self-test
        run: python tools/test-check-k.py

      # Check I's `future:` branch had a live subject and still went unchecked in one
      # direction: a `future:` reference whose target the library has since built. That drift
      # recurred three times before this test existed (ADR 0022, 2026-07-30, and the nine
      # labels swept alongside this file), because each fix corrected the labels and nothing
      # re-read them. The load-bearing assertions are the adversarial ones: `future:` on a
      # built bundle must FAIL, and the two failure kinds must not blur into one message.
      - name: Check I self-test
        run: python tools/test-check-i.py

      # The format axis (ADR 0028). Same argument as the check K self-test: most of this logic
      # has no live subject, since one bundle ships a second format and none ships two. The
      # load-bearing assertions are that two formats with unrelated outlines PASS (nesting is
      # within a format, never across), that a `_template-*.md` file the meta never declared
      # FAILS and is also scanned rather than sitting unread, and that a size word inside a
      # guidance sentence does not invent a variant.
      - name: Format axis self-test
        run: python tools/test-check-formats.py

      # The link gate. Bundle-scoped checks cannot see repo-wide breakage: the scaffold
      # graduation (decision 0009) broke four companion links and the bundle gate passed
      # green. This step also enforces the central rule of decision 0013 - no tracked file
      # may link into the untracked _local/, because such a link resolves for exactly one
      # person and 404s for every other reader.
      - name: Link gate
        run: python tools/check-links.py

      # The machine catalog. manifest.json is generated from the metas and committed; this
      # step regenerates it in memory and fails if the committed copy has drifted, and if the
      # README bundle-count marker disagrees with reality (decision 0018, roadmap WP-22).
      - name: Manifest freshness
        run: python tools/gen-manifest.py --check

      # The atlas built flags. atlas/catalog-data.json and the inline copy in atlas/atlas.html
      # both carry a per-type `built` boolean, which drifted (advertised 4 built while 12 existed).
      # This regenerates both from the bundles on disk and fails on drift (same discipline as the
      # manifest; ADR 0018). Closes the atlas half of the same failure class PR #30 corrected.
      - name: Atlas freshness
        run: python tools/gen-atlas.py --check

      # The decision-record index. docs/internal/decisions/README.md is a hand-maintained table;
      # 0022 and 0023 both landed without an index row and sat missing. This fails if any NNNN-*.md
      # ADR file has no index row, or an index row points at no file.
      - name: ADR index
        run: python tools/check-adr-index.py

      # Changelog freshness (DF-3). The three generated artifacts above are gated for drift and stayed
      # fresh; the changelog was not gated and went 28 commits, nine bundles and fourteen decision records
      # without an entry. This fails if any post-0.1.0 decision record is absent from CHANGELOG.md. It is
      # deliberately shallow: it proves nothing is missing, not that what is there is any good, and it says
      # so in its own output.
      - name: Changelog freshness
        run: python tools/check-changelog.py

      # The research-log contract (ADR 0029). The honest-retrieval standard is this library's
      # central quality claim and nothing checked it across sixteen bundles: the requirement bound
      # the research workflow's JSON schema, not the markdown that schema produces. This gates the
      # contract (number, identity, url or a stated exemption, tier, enum retrieval status,
      # Supports) and accepts all three numbered layouts. Six table-layout logs are exempt BY NAME
      # with a measured reason, and the check prints the exemption on every run.
      - name: Research-log contract
        run: python tools/check-research-logs.py

      # Same argument as the other two self-tests: most of the contract check's failure branches
      # have no live subject once the tree is clean, so the only way to know it fails when it should
      # is a fixture. Mutation-checked against three deliberate breakages.
      - name: Research-log contract self-test
        run: python tools/test-check-research-logs.py

      # The numbers this repository states about itself (finding DF-5, prose counts drift). Five times a
      # count retyped into prose went stale within hours: the bundle inventory, two self-test assertion
      # counts, the gated-log count, a README badge stuck at 11 of 27 while the real figure reached 17, and
      # the freshness banners added to manage staleness which then went stale themselves. Every GENERATED
      # count in this repo stays fresh; every RETYPED one drifts. This compares a marker in each document
      # against the tree, and says plainly that it cannot read the prose around it.
      - name: Self-reported counts
        run: python tools/check-counts.py

      # A worked example that is its own template's GOOD/WEAK hints reworded demonstrates nothing to a
      # reader who has already read the comments. This defect recurred FOUR times: product-strategy (7 of
      # 8 sections), product-roadmap (3 of 8, one sentence verbatim) after the "use a different scenario"
      # convention was adopted to prevent it, and okrs AGAIN with the different scenario actually in
      # place, because the reuse lives in the sentence skeleton and survives swapping every noun.
      # Convention cannot hold this line; a string check can. Triage on 2026-07-30 read all 16 flagged
      # bundles against their raw comment blocks and found zero false positives, so the 16 are
      # grandfathered at a measured ceiling that may only shrink, and a new or edited bundle fails on its
      # first copied passage.
      - name: Example independence
        run: python tools/check-example-independence.py

      # The library's differentiator is one continuous worked thread from a product vision down to a bug
      # report, and it only holds if the artifacts could have existed in the order the documents claim.
      # On 2026-07-29 the product-roadmap example, dated February, described work as "Specified in the
      # Saved Views PRD; in build" while that PRD is dated June and status in-review. Four months of time
      # travel in the file whose job is to demonstrate the thread holds together, past every gate check.
      # On its first run this found the same defect in product-strategy, 135 days wide.
      - name: Example chronology
        run: python tools/check-example-chronology.py

      # A rubric row that grades a section the variant does not ship penalises the CHOICE OF VARIANT rather
      # than the quality of the document. Three occurrences, all found by human review: product-strategy
      # graded its one-pager on sections it lacks; product-roadmap scored rows 7 and 8 against go and themes,
      # which ship neither; product-vision scored a horizon row against a PR/FAQ that has no horizon section,
      # and carried no scope table at all. Enforces the arithmetic and the presence of a scope table; the
      # section match itself is a heuristic and only warns.
      - name: Rubric scope
        run: python tools/check-rubric-scope.py

      # The workflow scripts hold their agent prompts in backtick-delimited template literals, so a
      # backtick written as markdown inside that prose closes the literal and the Workflow runtime
      # cannot load the script at all. Measured 2026-08-05: exactly that shipped through a green PR
      # and passed `node --check` with exit 0, because the stray backticks rebalanced into
      # expressions Node tolerates. Nothing in this repository parsed the workflow before this step,
      # so a broken harness was invisible until someone tried to run it. Second failure of this kind
      # after CRLF made a syntactically perfect script unrunnable, which .gitattributes now prevents.
      - name: Workflow prompt strings
        run: python tools/check-workflow-prompts.py

      # The efficacy eval's two arm prompts must share a byte-identical discipline block. The 2026-08-08
      # pilot could not interpret its own headline number because the control arm was told to produce
      # decision-usefulness and the treatment arm was not, while held-out criteria scored exactly that.
      # The fix gave both arms the identical instruction, and "identical" is the entire load: a paraphrase
      # would leave open the argument that one arm got better-worded advice. That identity now lives in
      # two hand-maintained files, which is the shape that has drifted every previous time this repository
      # has held one fact in two places without a check. Drift here would silently un-match the arms and
      # invalidate every number produced afterwards, with nothing failing and nothing looking wrong.
      - name: Eval arm parity
        run: python tools/check-eval-arm-parity.py

      # What this repository PUBLISHES must equal what it DECLARES. Measured 2026-08-08 by running the
      # install for the first time: `npx skills add` reported two skills and installed both, the second
      # being the maintainer-internal build harness, whose own description says it is not for library
      # users. Nothing here could see it. Every other check in this file validates the tree; none of them
      # asks what a stranger receives.
      #
      # The CLI scans thirty-one directory prefixes, twenty-seven of them agent-config directories
      # including .claude/skills, .codex/skills and .github/skills, and it reads no ignore file. So
      # relocating one file fixed one leak and this step is what keeps it fixed: the next one is most
      # likely .codex/skills, in a repository whose maintainer also uses Codex. ADR 0037.
      - name: Published skill surface
        run: python tools/check-export-surface.py

      # Listing clause L4 requires the registry entry, the release tag, library.json and every native
      # manifest to carry the same version, and names its verification method as "review". A human.
      # Cutting v0.3.1 on 2026-08-08 meant hand-editing that string in six places, and one of them is
      # not metadata at all: the skill's own body says it fetches templates from the tag matching its
      # metadata.version, so that field is half of a URL. A stale value there points every installed
      # copy at a tree it did not ship with, and nothing fails.
      #
      # Two of the six are deliberately NOT checked here, because they are already covered and a second
      # copy of a rule is the shape this check exists to prevent: INDEX.md by the Standard's own G4
      # (mutation-verified 2026-08-08), and the README badge by the toolkit's check-readme-version.mjs,
      # which is invoked in the conformance step at the bottom of this file.
      - name: Version agreement
        run: python tools/check-version-agreement.py

      # The research-log generator's own fixture test, on the ADR 0025 argument: its merge path has no
      # live subject once a run is clean, because a collision only happens when two dimensions own the
      # same source. That is precisely how its two predecessor bugs hid. Both are now pinned by fixtures
      # and every assertion is mutation-checked against a deliberately broken implementation.
      - name: Research-log generator self-test
        run: python tools/test-gen-research-log.py

      # The gate's dash check (check B) only scans inside bundles, but the house
      # rule is repo-wide and the methodology advertises it as CI-enforced. Without
      # this step an em-dash in the README, in STATE.md, or in any decision record
      # passes green. Scans git-tracked files only: untracked local scratch is not
      # the repo's problem.
      - name: No em-dashes or en-dashes (repo-wide)
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys

          EM, EN = chr(8212), chr(8211)
          EXTS = {".md", ".yaml", ".yml", ".py", ".json"}

          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split("\n")

          bad = []
          for name in tracked:
              if not name or pathlib.Path(name).suffix.lower() not in EXTS:
                  continue
              try:
                  text = pathlib.Path(name).read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              hits = [
                  n for n, line in enumerate(text.splitlines(), 1)
                  if EM in line or EN in line
              ]
              if hits:
                  bad.append((name, hits))

          for name, lines in bad:
              shown = ", ".join(str(n) for n in lines[:10])
              more = " ..." if len(lines) > 10 else ""
              print(f"{name}: em/en-dash on line(s) {shown}{more}")

          if bad:
              print(f"\nFAIL: {len(bad)} tracked file(s) contain an em-dash or en-dash.")
              print("House rule: use ' - ' (space hyphen space), or restructure the")
              print("sentence with a comma, colon, or break. Ranges use plain hyphens.")
              sys.exit(1)

          print("OK: no em-dash or en-dash in any tracked text file.")
          PY

      # The Advanced Skill Library Standard's own conformance gate (requirement G2, "self-hosting
      # CI"). Every other step above validates this repository against rules this repository wrote.
      # This one validates it against rules it did not write, which is the only kind of check that
      # can tell the maintainer something the maintainer did not already believe.
      #
      # THREE THINGS HERE LOOK LIKE THEY COULD BE SIMPLIFIED AND CANNOT.
      #
      # 1. THE PIN IS LOAD-BEARING. Cloning the toolkit's default branch would put a foreign
      #    repository's HEAD in front of every merge to this one: a stricter check landing over
      #    there would turn this repository red without a line changing here, and the failure would
      #    arrive attached to whichever innocent PR happened to be open. Pinned, a bump is a commit
      #    with a diff and a reason. This is the same discipline the marketplace registry uses when
      #    it pins a commit SHA rather than tracking a branch.
      #
      # 2. THE CHECKOUT MUST LAND OUTSIDE THE WORKSPACE, and actions/checkout cannot do that: its
      #    `path` is required to be inside $GITHUB_WORKSPACE. That is not a style preference. The
      #    toolkit's own folder-readme check (G8) builds a folder's expected child set with
      #    readdirSync, which sees untracked directories. A toolkit checked out to ./.toolkit would
      #    appear as a child of this repository's root that templates/README.md does not list, and
      #    G8 would fail on a directory that exists only while CI is running. That exact shape, an
      #    untracked directory readdirSync can see and a clean checkout cannot, is what made G8
      #    unsatisfiable here until the stale hook cache producing it was deleted on 2026-08-08.
      #    Putting the toolkit in RUNNER_TEMP is what stops this step from recreating that bug.
      #
      # 3. THE CHECKOUT IS SPARSE because only scripts/ is ever executed. It is also the difference
      #    between a clone that works and one that does not: the toolkit's test fixtures nest deeply
      #    enough to exceed MAX_PATH, so a full clone fails outright on a Windows contributor's
      #    machine while succeeding on this Linux runner. A recipe a maintainer cannot run locally
      #    is a recipe that gets debugged in CI.
      #
      # The gate exits non-zero only on findings AT or BELOW the declared tier; anything above it is
      # printed as informational and cannot affect the exit code. So this step going red means this
      # repository stopped meeting the tier it claims, which is exactly when it should go red.
      - name: Standard conformance gate (G2, self-hosting)
        env:
          TOOLKIT_REF: v1.10.0
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TOOLKIT_REF" --filter=blob:none --sparse \
            https://github.com/product-on-purpose/agent-skills-toolkit.git "$RUNNER_TEMP/toolkit"
          git -C "$RUNNER_TEMP/toolkit" sparse-checkout set scripts
          npm --prefix "$RUNNER_TEMP/toolkit" ci --omit=dev
          echo "toolkit $TOOLKIT_REF at $(git -C "$RUNNER_TEMP/toolkit" rev-parse --short HEAD)"
          node "$RUNNER_TEMP/toolkit/scripts/check.mjs" "$GITHUB_WORKSPACE"
          # The README's version lives inside a shields.io URL parameter, which is the one place
          # check-counts.py states in its own docstring that it cannot reach, and DF-5 recurred there on
          # 2026-08-07 with a badge two releases behind. The toolkit already ships the guard
          # (check-readme-version.mjs, library.json vs the badge, no dependencies) and this job already
          # has the toolkit cloned, so the honest fix was to invoke the tool that exists rather than
          # write a second copy of the same rule here.
          node "$RUNNER_TEMP/toolkit/scripts/check-readme-version.mjs" "$GITHUB_WORKSPACE"
