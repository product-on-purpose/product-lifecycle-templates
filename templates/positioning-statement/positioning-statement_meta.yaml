id: positioning-statement
title: Positioning Statement
summary: >-
  The internal, present-tense record of how this product stands against a named alternative, for a specific
  target customer, now. Not the vision (future-facing), not messaging (built on top of this once it is
  settled), and not a battlecard or a positioning map.
doc_type: positioning-statement
classification: foundation
family: strategy-docs
sizes_available: [lean]
default_size: lean
sizing_guidance: "This bundle ships one size. Every admitting source caps the artifact short: MIT states it 'forces you to use a one page format,' HubSpot and Yesware both give a three to five sentence ceiling, and Product Marketing Alliance's own template is a one page, five row document. The lean variant pairs the one-sentence statement with its named components (target, need, category, benefit, named alternative, differentiation) rather than shipping the bare sentence alone; there is no second, heavier size to choose instead."
methodology: methodology-agnostic
