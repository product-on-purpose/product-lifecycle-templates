id: product-principles
title: Product Principles
summary: >-
  The short standing set of beliefs a product team agrees once and then uses to settle product trade-offs:
  what to build, for whom, and what to refuse. Each principle carries a statement, why the team holds it,
  what it costs, what it rules out and a decision it settled. It is judged by whether a reasonable team
  could choose the opposite, because a principle nobody would reverse cannot settle an argument.
