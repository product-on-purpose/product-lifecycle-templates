classification: foundation
family: standing-standards
sizes_available: [lean]
default_size: lean
sizing_guidance: "Use lean, the only size, for every product: no source the research read publishes a fuller and a shorter version of one set, the sources it read advise three to five principles and none cites a measurement, and the sources that add depth add it per principle and not per document, so the template does the same, at medium confidence."
