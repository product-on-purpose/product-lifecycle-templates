id: lean-ux-canvas
title: Lean UX Canvas
summary: >-
  The one-page canvas that frames one initiative's business problem, the outcomes the business
  wants, the users affected, the outcomes those users want, and candidate solutions, then turns
  those links into testable hypotheses and names what to learn first and the least work that will
  learn it, before anyone commits to building.
