id: issue-log
title: Issue Log
summary: >-
  The living, owned record of problems that have already happened on a project or program and need
  someone above the day-to-day work to act on them: what the problem is, who owns getting it fixed,
  whether it has been escalated, and when it is genuinely closed. Distinguished from a risk register by
  tense, something that occurred rather than something that might, and useful only once a team states its
  own threshold for what counts as an issue here.
doc_type: issue-log
classification: utility
family: governance-docs
sizes_available: [lean, full]
default_size: lean
sizing_guidance: "Use lean (a stated threshold and what does not belong, a priority scale, the issues table with one named owner per row, the escalation rule, and review and ownership) when one team logs and resolves its own issues without a change-control hand-off or a lessons-learned record worth keeping. Use full when issues start resolving into other artifacts often enough that losing the trail matters, or when a governance board will ask, weeks later, what was actually decided and why; it adds a closed-issues audit trail (resolution, confirmer, closed date, lesson learned) and a links-to-other-logs block tracing each issue back to the risk it materialized from, the change request it raised, or the decision that closed it."
methodology: generic
pairs_with: []
status: beta
template_version: 0.1.0
