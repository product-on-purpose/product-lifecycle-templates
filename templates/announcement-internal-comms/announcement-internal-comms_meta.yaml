id: announcement-internal-comms
title: Announcement / Internal Comms
summary: >-
  The message that tells the people in an organization who did not do the work that something is launching
  or changing: what is changing, why it matters to this reader, what they must do and by when, and where the
  underlying record of the change lives. It translates a decision already made; it does not restate the
  decision's own supporting facts.
doc_type: announcement-internal-comms
family: delivery-docs
phase: deliver
sizes_available: [lean]
default_size: lean
sizing_guidance: "This bundle ships one size. The strongest source found for this type publishes seven worked templates sharing a single shape (a subject line, a salutation, three or four sentences), and even its highest-stakes examples differ from the rest by one sentence rather than an added section; building a heavier variant from that material would be inventing a shape no source documents, so none is offered."
