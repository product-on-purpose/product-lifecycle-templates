id: product-strategy
title: Product Strategy
summary: >-
  The document that says which problems this product will solve to reach its vision, and which it will not.
  It is judged by whether a competitor's name could be swapped in without the document becoming false: a
  strategy nobody could disagree with has not chosen anything.
doc_type: product-strategy
classification: foundation
family: strategy-docs
sizes_available: [lean, full]
default_size: lean
sizing_guidance: "Use lean (diagnosis, guiding policy, coherent action, and what that rules out) when a team that already shares the context needs to settle what to work on; four sections is enough to end the argument and be cited later. Use full when the strategy has to survive people who were not in the room: it adds who the strategy is and is not for, a falsifiable way to tell whether it is working, the assumptions it would die without, and an event that brings the team back to it. Full is also the right size when the strategy will be handed to an incoming leader, read alongside a funding decision, or used to decline something expensive."
default_format: kernel
default_format_guidance: "Reach for the kernel when the hard part is that nobody agrees what the problem is. Diagnosis, guiding policy and coherent action force the obstacle to be named before any choice is made, which is why it is the default: the defect this bundle's sources converge on is a strategy that never says what makes the goal hard."
additional_formats:
  - id: one-pager
    sizes: [full]
    guidance: "Reach for the one-pager when the problem is understood and the hard part is choosing where to compete. It opens with a winning aspiration and cascades through where to play, how to win, and the capabilities that requires, so the argument is about the choice rather than the diagnosis. If you cannot fill in where you will play because the team is still arguing about what is wrong, use the kernel instead."
methodology: methodology-agnostic
pairs_with: [foundation-lean-canvas]
status: beta
template_version: 0.1.0
