id: test-strategy
title: Test Strategy
summary: >-
  The standing document that sets the default testing approach for every project inside one organization or
  program: which levels, types, tools and environments apply by default, and the rule by which each
  project's own test plan either follows that default or states a reasoned deviation. It is not a test
  plan, a master test plan, or a Definition of Done.
doc_type: test-strategy
classification: foundation
family: standing-standards
sizes_available: [lean]
default_size: lean
sizing_guidance: "Ships in one size, lean, and deliberately has no full variant: neither this bundle's admission research nor its family-fit follow-up found a source describing a short form and a long form of a test strategy. Every structure found, Process Street's steps, Ofgem's own testing-scope structure and the catalog's own content note, is one comprehensive shape."
methodology: methodology-agnostic
